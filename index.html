<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🗾 日本行程 2026</title>
<style>
:root{
  --red:#C8392B;--navy:#0F2040;--cream:#F7F5F0;--card:#fff;
  --border:#E5E0D8;--text:#1A1A1A;--sub:#888;--radius:14px;
  --eat:#DC2626;--spot:#7C3AED;--shop:#16A34A;--hotel:#1E3A8A;--tran:#2563EB;
  --transport-bg:#F0F4FF;--transport-border:#BFCFFF;
  --note-bg:#FFFBEB;--note-border:#F59E0B;--note-text:#78350F;
  --shadow:0 2px 8px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);
  --bnav:60px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  background:var(--cream);color:var(--text);font-size:14px;
  max-width:480px;margin:0 auto;display:flex;flex-direction:column}

/* ── TOP HEADER ── */
.top-header{background:var(--navy);color:#fff;padding:14px 16px 0;flex-shrink:0;z-index:50}
.th-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.th-title{font-size:17px;font-weight:700;letter-spacing:.3px}
.th-sub{font-size:11px;color:rgba(255,255,255,.55);margin-top:2px}
.db-dot{width:8px;height:8px;border-radius:50%;background:#6B7280;flex-shrink:0;transition:background .3s;cursor:pointer}
.db-dot.ok{background:#22C55E}.db-dot.err{background:#EF4444}

/* ── DAY TABS ── */
.day-tabs{display:flex;overflow-x:auto;gap:6px;padding:0 14px 10px;scroll-snap-type:x mandatory}
.day-tabs::-webkit-scrollbar{display:none}
.dtab{flex-shrink:0;scroll-snap-align:start;border:1.5px solid rgba(255,255,255,.2);
  border-radius:20px;padding:4px 13px;font-size:12px;font-weight:600;
  color:rgba(255,255,255,.65);cursor:pointer;white-space:nowrap;line-height:1.4;text-align:center}
.dtab .dtab-date{font-size:13px;font-weight:700}
.dtab .dtab-wd{font-size:10px;opacity:.8}
.dtab.active{background:var(--red);border-color:var(--red);color:#fff}
.dtab.holiday{border-color:#F59E0B}
.dtab.active.holiday{background:#D97706;border-color:#D97706}

/* ── PERSON TABS (shopping) ── */
.person-tabs{display:flex;gap:6px;padding:12px 16px 0;background:var(--navy)}
.ptab{flex:1;border:1.5px solid rgba(255,255,255,.25);border-radius:20px;
  padding:6px;font-size:13px;font-weight:600;color:rgba(255,255,255,.65);
  cursor:pointer;background:transparent}
.ptab.active{background:var(--red);border-color:var(--red);color:#fff}

/* ── PAGES ── */
.page{display:none;flex-direction:column;flex:1;overflow:hidden}
.page.active{display:flex}
.page-body{flex:1;overflow-y:auto;padding:12px 12px calc(var(--bnav)+20px);-webkit-overflow-scrolling:touch}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;height:var(--bnav);
  background:var(--card);border-top:1px solid var(--border);
  display:flex;z-index:60}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;border:none;background:transparent;
  color:var(--sub);font-size:11px;font-weight:500;cursor:pointer;transition:color .15s}
.nav-btn .ni{font-size:22px;line-height:1}
.nav-btn.active{color:var(--red)}

/* ── DAY HEADER ── */
.day-hdr{padding:14px 4px 8px}
.day-hdr-title{font-size:20px;font-weight:800;color:var(--navy)}
.day-hdr-sub{font-size:12px;color:var(--sub);margin-top:2px}
.holiday-badge{display:inline-block;background:var(--red);color:#fff;
  font-size:10px;font-weight:700;padding:1px 7px;border-radius:4px;margin-left:6px;vertical-align:2px}
.holiday-badge.sw{background:#D97706}

/* ── BANNERS ── */
.banner{border-radius:10px;padding:9px 12px;margin:8px 0;font-size:12px;
  line-height:1.6;display:flex;gap:8px;align-items:flex-start;border:1px solid}
.bi{font-size:15px;flex-shrink:0}
.b-red{background:#FEE2E2;border-color:#FCA5A5;color:#7F1D1D}
.b-warn{background:#FEF3C7;border-color:#FCD34D;color:#78350F}
.b-blue{background:#EFF6FF;border-color:#93C5FD;color:#1E3A8A}

/* ── SEGMENTS LIST ── */
.segments{position:relative}

/* ── ITEM CARD ── */
.seg-item{margin:6px 0;position:relative}
.item-card{background:var(--card);border-radius:var(--radius);
  padding:11px 12px 10px;box-shadow:var(--shadow);border:1px solid var(--border);
  position:relative}
.ic-top{display:flex;align-items:flex-start;gap:8px}
.drag-handle{font-size:18px;color:#CCC;flex-shrink:0;cursor:grab;padding:0 2px;
  margin-top:-1px;touch-action:none;user-select:none}
.drag-handle:active{cursor:grabbing}
.ic-main{flex:1;min-width:0}
.ic-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.ic-time{font-size:12px;font-weight:700;color:var(--sub)}
.type-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.type-badge{font-size:10px;font-weight:600;padding:1px 7px;border-radius:5px;white-space:nowrap}
.ic-title{font-size:13px;font-weight:600;line-height:1.4;color:var(--text)}
.ic-desc{font-size:12px;color:var(--sub);line-height:1.6;margin-top:3px}
.ic-note{background:var(--note-bg);border-left:3px solid var(--note-border);
  border-radius:0 8px 8px 0;padding:7px 10px;margin-top:8px;
  font-size:11px;color:var(--note-text);line-height:1.6}
.ic-actions{position:absolute;top:10px;right:10px;display:flex;gap:4px}
.btn-sm{border:none;border-radius:6px;padding:4px 8px;font-size:11px;
  cursor:pointer;font-weight:500;line-height:1}
.btn-edit{background:#F3F4F6;color:#374151}
.btn-del{background:#FEE2E2;color:#B91C1C}

/* type colors */
.spot-c{background:#EDE9FE;color:#6D28D9}.spot-d{background:var(--spot)}
.eat-c{background:#FEE2E2;color:#B91C1C}.eat-d{background:var(--eat)}
.shop-c{background:#DCFCE7;color:#15803D}.shop-d{background:var(--shop)}
.hotel-c{background:#DBEAFE;color:#1E40AF}.hotel-d{background:var(--hotel)}
.tran-c{background:#DBEAFE;color:#1D4ED8}.tran-d{background:var(--tran)}

/* ── TRANSPORT CONNECTOR ── */
.seg-transport{margin:0;position:relative}
.transport-card{background:var(--transport-bg);border-left:3px solid var(--transport-border);
  border-radius:0 10px 10px 0;margin:0 0 0 16px;padding:9px 12px;
  display:flex;align-items:flex-start;gap:10px;position:relative}
.tr-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.tr-body{flex:1;min-width:0}
.tr-name{font-size:12px;font-weight:700;color:#1E3A8A}
.tr-line{font-size:11px;color:var(--sub);margin-top:1px}
.tr-times{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.tr-time{font-size:13px;font-weight:800;color:var(--red);letter-spacing:.3px}
.tr-arrow{font-size:11px;color:var(--sub)}
.tr-dur{font-size:11px;font-weight:600;color:#374151;background:#E0E7FF;
  padding:1px 7px;border-radius:10px}
.tr-cost{font-size:11px;color:var(--sub)}
.tr-note{background:#fff;border-radius:6px;padding:5px 8px;margin-top:6px;
  font-size:11px;color:var(--note-text);border:1px solid var(--note-border)}
.tr-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.tr-drag{font-size:16px;color:#B0B8D1;cursor:grab;flex-shrink:0;padding:0 2px;
  touch-action:none;user-select:none;margin-top:2px}

/* ── ADD BUTTONS ── */
.add-row{display:flex;gap:8px;margin:10px 0 4px}
.add-btn{flex:1;display:flex;align-items:center;justify-content:center;
  gap:5px;padding:10px;border:1.5px dashed var(--border);border-radius:10px;
  background:transparent;color:var(--sub);font-size:12px;cursor:pointer;transition:all .15s}
.add-btn:active{background:var(--border)}

/* ── SHOPPING ── */
.shop-section{margin-bottom:16px}
.shop-cat-hdr{display:flex;align-items:center;gap:8px;padding:10px 0 6px;
  font-size:13px;font-weight:700;color:var(--navy)}
.cat-pill{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.sl-item{background:var(--card);border-radius:10px;padding:10px 12px;
  margin-bottom:6px;box-shadow:var(--shadow);border:1px solid var(--border);
  display:flex;align-items:flex-start;gap:10px;position:relative}
.sl-check{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;font-size:13px;margin-top:1px}
.sl-item.done .sl-check{background:var(--shop);border-color:var(--shop);color:#fff}
.sl-item.done .sl-name{text-decoration:line-through;color:var(--sub)}
.sl-body{flex:1;min-width:0}
.sl-name{font-size:13px;font-weight:500;line-height:1.4}
.sl-meta{font-size:11px;color:var(--sub);margin-top:2px}
.sl-price{font-size:11px;color:var(--shop);font-weight:600}
.sl-del{border:none;background:#FEE2E2;color:#B91C1C;border-radius:6px;
  padding:4px 8px;font-size:11px;cursor:pointer;flex-shrink:0;align-self:flex-start}
.shop-progress{background:var(--border);border-radius:10px;height:4px;margin:4px 0 10px}
.shop-progress-bar{height:4px;border-radius:10px;background:var(--shop);transition:width .3s}
.shop-progress-text{font-size:11px;color:var(--sub);margin-bottom:6px}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;
  padding:18px 16px 40px;width:100%;max-width:480px;
  max-height:90vh;overflow-y:auto;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}
.modal-title{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--navy)}
.fg{margin-bottom:12px}
.flabel{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:4px;display:block}
.finput,.fselect,.ftextarea{width:100%;border:1.5px solid var(--border);
  border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit;
  color:var(--text);background:#FAFAFA;outline:none;transition:border-color .15s}
.finput:focus,.fselect:focus,.ftextarea:focus{border-color:var(--red)}
.ftextarea{min-height:72px;resize:vertical}
.frow{display:flex;gap:10px}.frow .fg{flex:1}
.mactions{display:flex;gap:10px;margin-top:14px}
.btn-save{flex:1;background:var(--red);color:#fff;border:none;border-radius:10px;
  padding:14px;font-size:15px;font-weight:600;cursor:pointer}
.btn-cancel{flex:1;background:var(--border);color:var(--text);border:none;
  border-radius:10px;padding:14px;font-size:15px;font-weight:600;cursor:pointer}

/* ── CONFIRM DIALOG ── */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);
  z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.confirm-overlay.open{display:flex}
.confirm-box{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:280px;text-align:center}
.confirm-title{font-size:15px;font-weight:600;margin-bottom:8px}
.confirm-sub{font-size:13px;color:var(--sub);margin-bottom:16px}
.confirm-btns{display:flex;gap:10px}
.conf-ok{flex:1;background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px;font-size:14px;font-weight:600;cursor:pointer}
.conf-no{flex:1;background:var(--border);color:var(--text);border:none;border-radius:8px;padding:10px;font-size:14px;cursor:pointer}

/* ── TOAST ── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:#1A1A1A;color:#fff;padding:8px 18px;border-radius:20px;
  font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:400;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="top-header" id="topHeader">
  <div class="th-row">
    <div>
      <div class="th-title">🗾 高山・上高地・名古屋 2026</div>
      <div class="th-sub">9/22（二）— 9/26（六）· 2026 銀色週</div>
    </div>
    <div id="dbDot" class="db-dot" title="點擊強制還原預設行程資料" onclick="forceResetData()"></div>
  </div>
  <div id="topTabs"></div></div>

<div id="page-itinerary" class="page active">
  <div class="page-body" id="itinerary-body"></div>
</div>

<div id="page-shopping" class="page">
  <div class="page-body" id="shopping-body"></div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-itinerary" onclick="setPage('itinerary')">
    <span class="ni">📅</span><span>行程</span>

  <button class="nav-btn" id="nav-shopping" onclick="setPage('shopping')">
    <span class="ni">🛍</span><span>購物清單</span>
  </button>
</nav>

<div class="modal-overlay" id="modalItem" onclick="closeModalOnBg(event,'modalItem')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalItemTitle">新增行程</div>

      <label class="flabel">時間</label>
      <input class="finput" id="iTime" placeholder="例：09:30" maxlength="5">

    <div class="fg">
      <label class="flabel">類型</label>
      <select class="fselect" id="iType">
        <option value="spot">🏔 景點</option>

        <option value="hotel">🏨 住宿</option>

    <div class="fg">

      <input class="finput" id="iTitle" placeholder="行程名稱">

    <div class="fg">
      <label class="flabel">說明</label>
      <textarea class="ftextarea" id="iDesc" placeholder="細節、費用..."></textarea>
    </div>
    <div class="fg">
      <label class="flabel">備註（會以色塊顯示）</label>
      <textarea class="ftextarea" id="iNote" placeholder="特別提醒、小訣竅..." style="min-height:56px"></textarea>
    </div>
    <div class="mactions">
      <button class="btn-cancel" onclick="closeModal('modalItem')">取消</button>
      <button class="btn-save" onclick="saveItem()">儲存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalTr" onclick="closeModalOnBg(event,'modalTr')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTrTitle">新增交通</div>
    <div class="fg">
      <label class="flabel">交通工具</label>
      <select class="fselect" id="tTool">
        <option value="JR">🚆 JR</option>
        <option value="名鉄">🚃 名鉄</option>
        <option value="巴士">🚌 巴士</option>
        <option value="地下鉄">🚇 地下鉄</option>
        <option value="計程車">🚕 計程車</option>
        <option value="步行">🚶 步行</option>
        <option value="飛機">✈️ 飛機</option>
      </select>
    </div>
    <div class="fg">
      <label class="flabel">路線／班次名稱</label>
      <input class="finput" id="tLine" placeholder="例：特急ひだ3号、μSky">
    </div>
    <div class="fg">
      <label class="flabel">行駛方向</label>
      <input class="finput" id="tDir" placeholder="例：名古屋→高山">
    </div>
    <div class="frow">
      <div class="fg"><label class="flabel">出發時間</label><input class="finput" id="tDep" placeholder="08:43" maxlength="5"></div>
      <div class="fg"><label class="flabel">抵達時間</label><input class="finput" id="tArr" placeholder="11:20" maxlength="5"></div>
    </div>
    <div class="frow">
      <div class="fg"><label class="flabel">所需時間</label><input class="finput" id="tDur" placeholder="2h37m"></div>
      <div class="fg"><label class="flabel">費用</label><input class="finput" id="tCost" placeholder="¥5,610"></div>
    </div>
    <div class="fg">
      <label class="flabel">備註</label>
      <textarea class="ftextarea" id="tNote" placeholder="注意事項..." style="min-height:56px"></textarea>
    </div>
    <div class="mactions">
      <button class="btn-cancel" onclick="closeModal('modalTr')">取消</button>
      <button class="btn-save" onclick="saveTr()">儲存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalShop" onclick="closeModalOnBg(event,'modalShop')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalShopTitle">新增購物項目</div>
    <div class="fg">
      <label class="flabel">商品名稱</label>
      <input class="finput" id="sName" placeholder="例：飛驒牛みそ漬け">
    </div>
    <div class="frow">
      <div class="fg">
        <label class="flabel">購買地點</label>
        <select class="fselect" id="sCat">
          <option value="高山">高山</option>
          <option value="上高地">上高地</option>
          <option value="名古屋">名古屋</option>
          <option value="機場">機場</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="fg">
        <label class="flabel">預算</label>
        <input class="finput" id="sPrice" placeholder="¥1,500">
      </div>
    </div>
    <div class="fg">
      <label class="flabel">備註</label>
      <input class="finput" id="sNote" placeholder="數量、注意事項...">
    </div>
    <div class="mactions">
      <button class="btn-cancel" onclick="closeModal('modalShop')">取消</button>
      <button class="btn-save" onclick="saveShopItem()">新增</button>
    </div>
  </div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-title">確認刪除</div>
    <div class="confirm-sub" id="confirmMsg">確定要刪除這個項目嗎？</div>
    <div class="confirm-btns">
      <button class="conf-no" onclick="closeConfirm(false)">取消</button>
      <button class="conf-ok" onclick="closeConfirm(true)">刪除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

// STATE
// ══════════════════════════════════════════════════════
let S = JSON.parse(JSON.stringify(D));
let db = null;
let saveTimer = null;
let curPage = 'itinerary';

// ══════════════════════════════════════════════════════
// FIREBASE
// ══════════════════════════════════════════════════════
function initFirebase(){
  const dot = document.getElementById('dbDot');
  if(!FB_CONFIG.apiKey){
    dot.title='未設定Firebase，使用本地儲存';
    loadLocal(); return;
  }
  try{
    firebase.initializeApp(FB_CONFIG);
    db = firebase.database();
    db.ref('japan2026').once('value').then(snap=>{
      const val = snap.val();
      // ✨ 關鍵修正：如果雲端沒資料、或者資料裡面的 days 不存在/長度為0，就自動將預設資料同步寫入雲端
      if(val && val.days && val.days.length > 0) {
        S = val;
        showToast('已同步雲端行程 ☁️');
      } else {
        S = JSON.parse(stringifyData(D));
        db.ref('japan2026').set(S);
        showToast('初始化雲端資料庫 🚀');
      }
      dot.classList.add('ok');
      dot.title='Firebase 已連線 (點擊可還原預設資料)';
      renderAll();
    }).catch(e=>{
      console.warn('Firebase read failed',e);
      dot.classList.add('err'); dot.title='Firebase 讀取失敗，使用本地儲存';
      loadLocal();
    });
  }catch(e){
    dot.classList.add('err');
    loadLocal();
  }
}

// 用來輔助深拷貝與排除例外
function stringifyData(obj) {
  return JSON.stringify(obj, (key, value) => value === undefined ? null : value);
}

// 💥 隱藏功能：萬一以後想要徹底清空、重創預設行程，可以點擊右上角的圓點
function forceResetData() {
  if(confirm("確定要清除所有修改，並將「雲端與本地資料」恢復到最原始的預設行程嗎？")) {
    S = JSON.parse(stringifyData(D));
    if(db) {
      db.ref('japan2026').set(S).then(() => {
        showToast('已強制還原預設資料 🔄');
        renderAll();
      });
    } else {
      localStorage.setItem('japan2026', stringifyData(S));
      showToast('已還原本地預設資料 🔄');
      renderAll();
    }
  }
}

function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 800);
}

function doSave(){
  try{ localStorage.setItem('japan2026', stringifyData(S)); }catch(e){}
  if(db){
    db.ref('japan2026').set(S)
      .then(()=>showToast('已儲存 ☁️'))
      .catch(e=>{console.warn('Firebase save err',e); showToast('本地儲存 💾');});
  } else {
    showToast('本地儲存 💾');
  }
}

function loadLocal(){
  try{
    const s = localStorage.getItem('japan2026');
    if(s) S = JSON.parse(s);
  }catch(e){}
  renderAll();
}

// ══════════════════════════════════════════════════════

function setPage(p){
  curPage = p;
  updateNav();
  renderTopTabs();
}

function updateNav(){
  document.getElementById('page-itinerary').classList.toggle('active', curPage==='itinerary');
  document.getElementById('page-shopping').classList.toggle('active', curPage==='shopping');
  document.getElementById('nav-itinerary').classList.toggle('active', curPage==='itinerary');
  document.getElementById('nav-shopping').classList.toggle('active', curPage==='shopping');
  renderTopTabs();
}

function renderTopTabs(){
  const c = document.getElementById('topTabs');
  if(curPage==='itinerary'){
    c.innerHTML = '<div class="day-tabs" id="day-tabs-inner"></div>';
    const dt = document.getElementById('day-tabs-inner');
    S.days.forEach((d,i)=>{
      const el = document.createElement('div');
      el.className = 'dtab' + (i===curDay?' active':'') + (d.silverWeek?' holiday':'');
      el.innerHTML = `<div class="dtab-date">${d.date}</div><div class="dtab-wd">${d.wd}${d.holiday?'・'+d.holiday.replace('国民の休日','國休'):''}`.slice(0,20)+'</div>';
      el.onclick = ()=>{ curDay=i; renderAll(); };
      dt.appendChild(el);
    });
  } else {
    c.innerHTML = `<div class="person-tabs">
      <button class="ptab${curPerson==='yenru'?' active':''}" onclick="setPerson('yenru')">燕如</button>
      <button class="ptab${curPerson==='yueyun'?' active':''}" onclick="setPerson('yueyun')">月雲</button>
    </div>`;
  }
}

function setPerson(p){ curPerson=p; renderAll(); }

// ══════════════════════════════════════════════════════
// ITINERARY RENDER
// ══════════════════════════════════════════════════════
function renderItinerary(){
  renderTopTabs();
  const day = S.days[curDay];
  if(!day) return;
  const body = document.getElementById('itinerary-body');

  let html = `<div class="day-hdr">
    <div class="day-hdr-title">${day.date}（${day.wd}）
      ${day.holiday?`<span class="holiday-badge${day.silverWeek?' sw':''}">${day.holiday}</span>`:''}
    </div>
    <div class="day-hdr-sub">${day.label}</div>
  </div>`;

  (day.banners||[]).forEach(b=>{
    html += `<div class="banner b-${b.t}"><span class="bi">${b.i}</span><div>${b.msg}</div></div>`;
  });

  html += `<div class="segments" id="segments-${curDay}">`;
  (day.segments||[]).forEach(seg=>{
    if(seg.k==='item') html += renderItem(seg, curDay);
    else html += renderTr(seg, curDay);
  });
  html += '</div>';

  html += `<div class="add-row">
    <button class="add-btn" onclick="openAddItem(${curDay})">＋ 新增行程</button>
    <button class="add-btn" onclick="openAddTr(${curDay})">＋ 新增交通</button>
  </div>`;

  body.innerHTML = html;
  initSortable(curDay);
}

function renderItem(seg, di){
  const tc = TC[seg.type] || TC.spot;
  return `<div class="seg-item" data-id="${seg.id}" data-k="item">
    <div class="item-card">
      <div class="ic-top">
        <span class="drag-handle" title="拖曳排序">⠿</span>
        <div class="ic-main">
          <div class="ic-meta">
            ${seg.time?`<span class="ic-time">${seg.time}</span>`:''}
            <span class="type-badge ${tc.badge}">${tc.label}</span>
          </div>
          <div class="ic-title">${esc(seg.title)}</div>
          ${seg.desc?`<div class="ic-desc">${esc(seg.desc)}</div>`:''}
          ${seg.note?`<div class="ic-note">📌 ${esc(seg.note)}</div>`:''}
        </div>
      </div>
      <div class="ic-actions">
        <button class="btn-sm btn-edit" onclick="openEditItem(${di},'${seg.id}')">✏️</button>
        <button class="btn-sm btn-del" onclick="confirmDel(()=>delSeg(${di},'${seg.id}'))">✕</button>
      </div>
    </div>
  </div>`;
}

function renderTr(seg, di){
  const icon = TOOL_ICON[seg.tool] || '🚌';
  const timeRow = (seg.dep||seg.arr) ?
    `<span class="tr-time">${seg.dep||'—'}</span>
     <span class="tr-arrow">→</span>
     <span class="tr-time">${seg.arr||'—'}</span>` : '';
  return `<div class="seg-transport" data-id="${seg.id}" data-k="tr">
    <div class="transport-card">
      <span class="tr-drag" title="拖曳排序">⠿</span>
      <span class="tr-icon">${icon}</span>
      <div class="tr-body">
        <div class="tr-name">${esc(seg.tool)} ${esc(seg.line||'')}</div>
        ${seg.dir?`<div class="tr-line">${esc(seg.dir)}</div>`:''}
        <div class="tr-times">
          ${timeRow}
          ${seg.dur?`<span class="tr-dur">${esc(seg.dur)}</span>`:''}
          ${seg.cost?`<span class="tr-cost">${esc(seg.cost)}</span>`:''}
        </div>
        ${seg.note?`<div class="tr-note">📌 ${esc(seg.note)}</div>`:''}
      </div>
      <div class="tr-actions">
        <button class="btn-sm btn-edit" onclick="openEditTr(${di},'${seg.id}')">✏️</button>
        <button class="btn-sm btn-del" onclick="confirmDel(()=>delSeg(${di},'${seg.id}'))">✕</button>
      </div>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════
// SORTABLE
// ══════════════════════════════════════════════════════
function initSortable(di){
  const el = document.getElementById('segments-'+di);
  if(!el) return;
  if(sortables[di]) try{ sortables[di].destroy(); }catch(e){}
  sortables[di] = Sortable.create(el,{
    handle:'.drag-handle, .tr-drag',
    animation:180,
    ghostClass:'sortable-ghost',
    onEnd(evt){
      const day = S.days[di];
      const moved = day.segments.splice(evt.oldIndex,1)[0];
      day.segments.splice(evt.newIndex,0,moved);
      scheduleSave();
    }
  });
}

// ══════════════════════════════════════════════════════
// ITEM CRUD
// ══════════════════════════════════════════════════════
function openAddItem(di){
  editCtx = {mode:'item', dayIdx:di, id:null};
  document.getElementById('modalItemTitle').textContent='新增行程';
  document.getElementById('iTime').value='';
  document.getElementById('iType').value='spot';
  document.getElementById('iTitle').value='';
  document.getElementById('iDesc').value='';
  document.getElementById('iNote').value='';
  openModal('modalItem');
}

function openEditItem(di, id){
  const seg = S.days[di].segments.find(s=>s.id==id);
  if(!seg) return;
  editCtx = {mode:'item', dayIdx:di, id:seg.id};
  document.getElementById('modalItemTitle').textContent='編輯行程';
  document.getElementById('iTime').value=seg.time||'';
  document.getElementById('iType').value=seg.type||'spot';
  document.getElementById('iTitle').value=seg.title||'';
  document.getElementById('iDesc').value=seg.desc||'';
  document.getElementById('iNote').value=seg.note||'';
  openModal('modalItem');
}

function saveItem(){
  const title = document.getElementById('iTitle').value.trim();
  if(!title){ alert('請輸入標題'); return; }
  const seg = {
    k:'item',
    id: editCtx.id || mkId(),
    type: document.getElementById('iType').value,
    time: document.getElementById('iTime').value.trim(),
    title, 
    desc: document.getElementById('iDesc').value.trim(),
    note: document.getElementById('iNote').value.trim()
  };
  const day = S.days[editCtx.dayIdx];
  if(!day.segments) day.segments = [];
  if(editCtx.id){ 
    const idx = day.segments.findIndex(s=>s.id==editCtx.id);
    if(idx>=0) day.segments[idx]=seg;
  } else {
    day.segments.push(seg);
  }
  closeModal('modalItem');
  scheduleSave();
  renderItinerary();
}

  document.getElementById('tDir').value=seg.dir||'';
  document.getElementById('tDep').value=seg.dep||'';

function saveTr(){

    k:'tr',

    dep:  document.getElementById('tDep').value.trim(),

  if(editCtx.id){

    if(idx>=0) day.segments[idx]=seg;
  } else {

  closeModal('modalTr');

function delSeg(di, id){
  S.days[di].segments = S.days[di].segments.filter(s=>s.id!=id);

  renderItinerary();
}

// ══════════════════════════════════════════════════════
// SHOPPING RENDER
// ══════════════════════════════════════════════════════
function renderShopping(){
  renderTopTabs();
  if(!S.shopping) S.shopping = { yenru: [], yueyun: [] };
  const list = S.shopping[curPerson] || [];
  const cats = ['高山','上高地','名古屋','機場','其他'];
  const body = document.getElementById('shopping-body');

  const total = list.length;
  const done = list.filter(i=>i.done).length;
  const pct = total ? Math.round(done/total*100) : 0;

  let html = `<div style="padding:8px 4px 0">
    <div class="shop-progress-text">${done} / ${total} 項已完成（${pct}%）</div>
    <div class="shop-progress"><div class="shop-progress-bar" style="width:${pct}%"></div></div>
  </div>`;

  cats.forEach(cat=>{
    const items = list.filter(i=>i.cat===cat);
    if(!items.length) return;
    const cc = CAT_COLOR[cat]||'#6B7280';
    html += `<div class="shop-section">
      <div class="shop-cat-hdr">
        <span class="cat-pill" style="background:${cc}20;color:${cc}">📍 ${cat}</span>
        <span style="font-size:12px;color:var(--sub)">${items.filter(i=>i.done).length}/${items.length}</span>
      </div>`;
    items.forEach(item=>{
      html += `<div class="sl-item${item.done?' done':''}" id="sl-${item.id}">
        <div class="sl-check" onclick="toggleShop('${curPerson}',${item.id})">${item.done?'✓':''}</div>
        <div class="sl-body">
          <div class="sl-name">${esc(item.name)}</div>
          <div class="sl-meta">
            ${item.price?`<span class="sl-price">${esc(item.price)}</span>`:''}
            ${item.note?` · ${esc(item.note)}`:''}
          </div>
        </div>
        <button class="sl-del" onclick="delShop('${curPerson}',${item.id})">✕</button>
      </div>`;
    });
    html += '</div>';
  });

  // Uncategorized
  const others = list.filter(i=>!cats.includes(i.cat));
  if(others.length){
    html += `<div class="shop-section"><div class="shop-cat-hdr">其他</div>`;
    others.forEach(item=>{
      html += `<div class="sl-item${item.done?' done':''}" id="sl-${item.id}">
        <div class="sl-check" onclick="toggleShop('${curPerson}',${item.id})">${item.done?'✓':''}</div>
        <div class="sl-body"><div class="sl-name">${esc(item.name)}</div>
          <div class="sl-meta">${item.price?`<span class="sl-price">${esc(item.price)}</span>`:''}${item.note?` · ${esc(item.note)}`:''}</div>
        </div>
        <button class="sl-del" onclick="delShop('${curPerson}',${item.id})">✕</button>
      </div>`;
    });
    html += '</div>';
  }

  html += `<button class="add-btn" onclick="openAddShop()" style="width:100%;margin-top:8px">＋ 新增購物項目</button>`;
  body.innerHTML = html;
}

// ══════════════════════════════════════════════════════
// SHOPPING CRUD
// ══════════════════════════════════════════════════════
function openAddShop(){
  editCtx = {mode:'shop', person:curPerson};
  document.getElementById('modalShopTitle').textContent = (curPerson==='yenru'?'燕如':'月雲')+' 新增購物';
  document.getElementById('sName').value='';
  document.getElementById('sCat').value='高山';
  document.getElementById('sPrice').value='';
  document.getElementById('sNote').value='';
  openModal('modalShop');
}

function saveShopItem(){
  const name = document.getElementById('sName').value.trim();
  if(!name){ alert('請輸入商品名稱'); return; }
  const item = {
    id: mkId(),
    cat: document.getElementById('sCat').value,
    name,
    price: document.getElementById('sPrice').value.trim(),
    note: document.getElementById('sNote').value.trim(),
    done: false
  };
  if(!S.shopping) S.shopping = { yenru: [], yueyun: [] };
  if(!S.shopping[editCtx.person]) S.shopping[editCtx.person]=[];
  S.shopping[editCtx.person].push(item);
  closeModal('modalShop');
  scheduleSave();
  renderShopping();
}

function toggleShop(person, id){
  const item = (S.shopping[person]||[]).find(i=>i.id==id);
  if(item){ item.done=!item.done; scheduleSave(); renderShopping(); }
}

function delShop(person, id){
  confirmDel(()=>{
    S.shopping[person] = (S.shopping[person]||[]).filter(i=>i.id!=id);
    scheduleSave();
    renderShopping();
  });
}

// ══════════════════════════════════════════════════════
// MODALS & UTILS
// ══════════════════════════════════════════════════════
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function closeModalOnBg(e,id){ if(e.target.id===id) closeModal(id); }

function confirmDel(cb){
  confirmCb = cb;
  document.getElementById('confirmOverlay').classList.add('open');
}
function closeConfirm(yes){
  document.getElementById('confirmOverlay').classList.remove('open');
  if(yes && confirmCb) confirmCb();
  confirmCb = null;
}

let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2000);
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
